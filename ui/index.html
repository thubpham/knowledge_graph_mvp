<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Graph</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<style>
  :root {
    --bg: #fbfbfa;
    --panel: #ffffff;
    --panel-soft: #f7f7f5;
    --border: #e9e9e7;
    --text: #35342f;
    --text-soft: #78766f;
    --text-faint: #9b988f;
    --accent: #4a6fa1;
    --accent-soft: #eaf0f8;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
    --shadow-lg: 0 8px 30px rgba(0,0,0,.10);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --panel: #1f2022;
      --panel-soft: #242527;
      --border: #2c2d2f;
      --text: #e7e6e2;
      --text-soft: #a3a19b;
      --text-faint: #6e6d68;
      --accent: #7ea3d6;
      --accent-soft: #1c2837;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
      --shadow-lg: 0 8px 40px rgba(0,0,0,.5);
    }
  }

  * , *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  #cy { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #cy.panning { cursor: grabbing; }

  /* ── Top search bar ─────────────────────────────────────────── */
  .topbar {
    position: absolute;
    top: 20px; left: 50%; transform: translateX(-50%);
    width: min(640px, calc(100% - 48px));
    z-index: 20;
    display: flex; flex-direction: column; gap: 10px;
  }

  .search-shell {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    padding: 4px 4px 4px 16px;
    gap: 8px;
    position: relative;
  }

  .search-shell input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 0.92rem;
    color: var(--text);
    padding: 10px 0;
  }
  .search-shell input::placeholder { color: var(--text-faint); }

  .search-shell button {
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .12s;
  }
  .search-shell button:hover { opacity: .85; }
  .search-shell button:disabled { opacity: .4; cursor: not-allowed; }

  .autocomplete {
    position: absolute;
    top: calc(100% + 6px); left: 0; right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    max-height: 260px;
    overflow-y: auto;
    display: none;
    z-index: 30;
  }
  .autocomplete.show { display: block; }
  .ac-row { padding: 8px 14px; cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
  .ac-row:hover, .ac-row.active { background: var(--panel-soft); }
  .ac-row .ac-name { font-size: 0.85rem; color: var(--text); }
  .ac-row .ac-type { font-size: 0.7rem; color: var(--text-faint); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 0.76rem;
    color: var(--text-soft);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: border-color .15s, color .15s, transform .1s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

  #status-bar {
    text-align: center;
    font-size: 0.76rem;
    color: var(--text-faint);
    min-height: 16px;
  }
  #status-bar.error { color: #b3564a; }

  /* ── Legend ─────────────────────────────────────────────────── */
  .legend {
    position: absolute;
    bottom: 20px; left: 20px;
    z-index: 20;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    font-size: 0.76rem;
    color: var(--text-soft);
    overflow: hidden;
  }
  .legend-header {
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: .05em;
    font-size: 0.68rem;
  }
  .legend-body { padding: 2px 12px 10px; display: none; flex-direction: column; gap: 6px; }
  .legend.open .legend-body { display: flex; }
  .legend-row { display: flex; align-items: center; gap: 7px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  /* ── Reset / toolbar ────────────────────────────────────────── */
  .toolbar {
    position: absolute;
    bottom: 20px; right: 20px;
    z-index: 20;
    display: flex;
    gap: 8px;
  }
  .tool-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 8px 13px;
    font-size: 0.78rem;
    color: var(--text-soft);
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .tool-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Inspector drawer ───────────────────────────────────────── */
  .drawer {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 360px;
    max-width: 90vw;
    background: var(--panel);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    z-index: 40;
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.4,0,.2,1);
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-head {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .drawer-close {
    position: absolute; top: 16px; right: 16px;
    width: 26px; height: 26px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
  }
  .drawer-close:hover { background: var(--panel-soft); color: var(--text); }

  .drawer-type {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-faint);
    background: var(--panel-soft);
    border-radius: 5px;
    padding: 2px 7px;
    margin-bottom: 8px;
  }
  .drawer-type .dot { width: 7px; height: 7px; border-radius: 50%; }
  .drawer-title { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; padding-right: 30px; }
  .drawer-summary {
    margin-top: 8px;
    font-size: 0.84rem;
    line-height: 1.55;
    color: var(--text-soft);
  }

  .drawer-body { flex: 1; overflow-y: auto; padding: 4px 0 20px; }
  .drawer-section { padding: 14px 20px 4px; }
  .drawer-section h4 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-faint);
    margin: 0 0 8px;
    font-weight: 600;
  }

  .fact-row {
    padding: 9px 11px;
    background: var(--panel-soft);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 0.82rem;
    line-height: 1.5;
    cursor: pointer;
    transition: box-shadow .12s;
  }
  .fact-row:hover { box-shadow: inset 0 0 0 1px var(--accent); }
  .fact-row .frel { color: var(--accent); font-family: ui-monospace, monospace; font-size: 0.72rem; }
  .fact-row .fother { color: var(--text-soft); font-size: 0.72rem; margin-top: 3px; }

  .empty-note { font-size: 0.78rem; color: var(--text-faint); padding: 4px 0 10px; }

  /* ── Floating answer card ──────────────────────────────────── */
  .answer-wrap {
    position: absolute;
    left: 20px; bottom: 20px;
    width: min(480px, calc(100% - 400px));
    max-height: 60vh;
    z-index: 25;
    display: none;
    flex-direction: column;
  }
  .answer-wrap.show { display: flex; }

  .answer-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 16px 18px;
    overflow-y: auto;
  }
  .answer-card .a-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--accent);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .answer-card .a-close { cursor: pointer; color: var(--text-faint); font-size: 0.9rem; }
  .answer-card .a-text { font-size: 0.88rem; line-height: 1.6; color: var(--text); }

  .answer-card .a-facts { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .answer-card .a-fact {
    font-size: 0.78rem;
    color: var(--text-soft);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .answer-card .a-fact:last-child { border-bottom: none; }
  .answer-card .a-fact:hover { color: var(--accent); }

  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 50;
    font-size: 0.85rem;
    color: var(--text-faint);
    transition: opacity .25s;
  }
  .loading-overlay.hide { opacity: 0; pointer-events: none; }

  /* ── Breathing halo (focused node) ───────────────────────────── */
  #node-halo {
    position: absolute;
    top: 0; left: 0;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    pointer-events: none;
    transform: translate(-50%, -50%) scale(1);
    opacity: 0;
    z-index: 15;
  }
  #node-halo.active { animation: haloBreathe 2.2s ease-in-out infinite; }
  @keyframes haloBreathe {
    0%   { transform: translate(-50%, -50%) scale(1);    opacity: .5; }
    50%  { transform: translate(-50%, -50%) scale(1.45); opacity: .12; }
    100% { transform: translate(-50%, -50%) scale(1);    opacity: .5; }
  }

  .note-pill {
    position: absolute;
    top: 20px; right: 20px;
    z-index: 20;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 7px 12px;
    font-size: 0.72rem;
    color: var(--text-faint);
    max-width: 220px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div id="cy"></div>
<div id="node-halo"></div>

<div class="loading-overlay" id="loading">
  <span class="spinner"></span>&nbsp;Loading graph…
</div>

<div class="topbar">
  <div class="search-shell">
    <input id="q" type="text" placeholder="Ask a question, or search an entity…" autocomplete="off" />
    <button id="ask-btn">Ask</button>
    <div class="autocomplete" id="autocomplete"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="status-bar"></div>
</div>

<div class="legend" id="legend">
  <div class="legend-header" id="legend-toggle">● Legend</div>
  <div class="legend-body" id="legend-body"></div>
</div>

<div class="toolbar">
  <div class="tool-btn" id="reset-btn">Reset view</div>
</div>

<div class="answer-wrap" id="answer-wrap"></div>

<div class="drawer" id="drawer">
  <div class="drawer-head">
    <button class="drawer-close" id="drawer-close">✕</button>
    <div class="drawer-type" id="drawer-type"></div>
    <div class="drawer-title" id="drawer-title"></div>
    <div class="drawer-summary" id="drawer-summary"></div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
cytoscape.use(cytoscapeFcose);

// ── Type color palette ──────────────────────────────────────────────────
// Same lightness/chroma across all types, hue rotated — calmer & more
// cohesive than arbitrary hex picks, while keeping each type legible.
const TYPE_HUES = {
  person:       255,
  service:      165,
  tool:         55,
  concept:      295,
  team:         330,
  organization: 200,
  event:        25,
  location:     0,
  website:      215,
};
let fallbackHueIdx = 0;

// Cytoscape's own style parser doesn't understand CSS oklch() strings — it
// needs plain hex/rgb. Convert oklch -> sRGB hex ourselves (once, cached)
// so the palette definition still lives in oklch (shared L/C, hue-rotated)
// but Cytoscape only ever sees hex.
function oklchToHex(L, C, Hdeg) {
  const h = Hdeg * Math.PI / 180;
  const a = Math.cos(h) * C, b = Math.sin(h) * C;
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
  const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
  let r =  4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
  let g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
  let bl = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
  const toSrgb = c => {
    c = Math.max(0, Math.min(1, c));
    c = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
    return Math.round(Math.max(0, Math.min(1, c)) * 255);
  };
  const [R, G, B] = [toSrgb(r), toSrgb(g), toSrgb(bl)];
  return '#' + [R, G, B].map(x => x.toString(16).padStart(2, '0')).join('');
}
const _colorCache = {};
function colorForType(t) {
  if (!(t in TYPE_HUES)) {
    TYPE_HUES[t] = (fallbackHueIdx * 47 + 40) % 360;
    fallbackHueIdx++;
  }
  const key = 'main-' + TYPE_HUES[t];
  if (!_colorCache[key]) _colorCache[key] = oklchToHex(0.64, 0.10, TYPE_HUES[t]);
  return _colorCache[key];
}
function colorForTypeSoft(t) {
  const hue = TYPE_HUES[t] ?? 0;
  const key = 'soft-' + hue;
  if (!_colorCache[key]) _colorCache[key] = oklchToHex(0.90, 0.03, hue);
  return _colorCache[key];
}

// ── Degree-based sizing: hubs read as hubs ────────────────────────────────
function sizeForDegree(ele) {
  const deg = ele.data('degree') || 0;
  const base = ele.data('type') === 'person' ? 18 : 14;
  return Math.min(base + Math.sqrt(deg) * 7, 34);
}

// ── Edge confidence -> thickness/opacity: weak facts read as weak ────────
function edgeConfidence(ele) {
  const c = parseFloat(ele.data('confidence'));
  return isNaN(c) ? 0.75 : c;
}

let cy;
let allNodes = [];
let allEdges = [];
let physics = null;

// ── Load graph ───────────────────────────────────────────────────────────
async function loadGraph() {
  const resp = await fetch('/graph');
  const data = await resp.json();
  allNodes = data.nodes;
  allEdges = data.edges;

  const degree = {};
  allEdges.forEach(e => {
    degree[e.source] = (degree[e.source] || 0) + 1;
    degree[e.target] = (degree[e.target] || 0) + 1;
  });

  const elements = [
    ...allNodes.map(n => ({
      data: { id: n.id, label: n.name, type: n.type, summary: n.summary, degree: degree[n.id] || 0 },
    })),
    ...allEdges.map(e => ({
      data: {
        id: e.id, source: e.source, target: e.target,
        relation: e.relation, fact: e.fact, score: e.score,
        valid_from: e.valid_from, valid_until: e.valid_until, confidence: e.confidence,
      },
    })),
  ];

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    minZoom: 0.1,
    maxZoom: 3.5,
    wheelSensitivity: 0.25,
    // kill Cytoscape's default tap/select overlay halo — this was the
    // "blue blob" on click. We draw our own crisp ring via .glow instead.
    selectionType: 'single',
    style: [
      { selector: 'node', style: {
        'background-color': ele => colorForType(ele.data('type')),
        'label': 'data(label)',
        'font-size': 8,
        'color': '#78766f',
        'text-valign': 'bottom',
        'text-margin-y': 4,
        'width': ele => sizeForDegree(ele), 'height': ele => sizeForDegree(ele),
        'border-width': 2,
        'border-color': '#ffffff',
        'border-opacity': 0.8,
        'overlay-opacity': 0,
        'transition-property': 'border-width, border-color, background-color',
        'transition-duration': 140,
      }},
      { selector: 'edge', style: {
        'width': ele => 0.6 + edgeConfidence(ele) * 2.2,
        'curve-style': 'bezier',
        'line-color': '#c9c9c3',
        'target-arrow-color': '#c9c9c3',
        'target-arrow-shape': 'triangle',
        'arrow-scale': 0.6,
        'opacity': ele => 0.18 + edgeConfidence(ele) * 0.45,
        'label': '',
        'font-size': 7.5,
        'color': '#6b6a64',
        'text-rotation': 'autorotate',
        'text-background-color': 'var(--panel)'.startsWith('var') ? '#fbfbfa' : '',
        'text-background-opacity': 0,
        'text-background-padding': 2,
        'text-background-shape': 'roundrectangle',
        'overlay-opacity': 0,
        'transition-property': 'opacity, line-color, width, text-background-opacity',
        'transition-duration': 140,
      }},
      // hover: a touch bigger, accent ring — no filled halo
      { selector: '.hover-highlight', style: {
        'width': ele => sizeForDegree(ele) + 6, 'height': ele => sizeForDegree(ele) + 6,
        'border-width': 3, 'border-color': '#4a6fa1',
      }},
      { selector: '.edge-label-show', style: {
        'label': 'data(relation)', 'opacity': 0.9, 'width': ele => 1.4 + edgeConfidence(ele) * 2,
        'text-background-opacity': 0.85,
      }},
      // click / ego-focus: crisp outlined ring around the node, node itself
      // stays its normal small dot — this replaces the old filled overlay.
      { selector: 'node.glow', style: {
        'border-width': 3, 'border-color': '#4a6fa1', 'border-opacity': 1,
        'width': ele => sizeForDegree(ele) + 4, 'height': ele => sizeForDegree(ele) + 4,
      }},
      { selector: 'edge.glow', style: {
        'opacity': 1, 'line-color': '#4a6fa1', 'target-arrow-color': '#4a6fa1', 'width': 2,
      }},
      { selector: '.dimmed', style: { 'opacity': 0.08 } },
      { selector: 'node.dimmed', style: { 'opacity': 0.15 } },
    ],
    layout: {
      name: 'fcose', animate: false, randomize: true,
      nodeSeparation: 90, idealEdgeLength: 70,
      // don't grid-pack disconnected components — this was the "isolated
      // nodes line up in a square" bug. We also scatter them explicitly
      // below for nodes so sparse they're components of size 1.
      packComponents: false,
    },
  });

  // scatter true isolates (degree 0) loosely across the whole canvas,
  // among the connected cluster, instead of leaving them wherever the
  // layout happened to drop them.
  scatterIsolatedNodes();

  document.getElementById('loading').classList.add('hide');
  buildLegend();
  attachInteractions();
  initHalo();
  // GraphPhysics disabled: at this graph's scale (1000+ nodes) its
  // collision-repulsion step is an O(n^2) check every animation frame,
  // which is a real perf problem, not a tuning one — it'd need spatial
  // partitioning (grid/quadtree) to run smoothly at this size. Pan/zoom/
  // drag/click all still work fully; nodes just stay where the layout
  // placed them instead of ambient-drifting.
  // physics = new GraphPhysics(cy);
  // physics.start();
}

function scatterIsolatedNodes() {
  const isolates = cy.nodes().filter(n => n.degree() === 0);
  if (!isolates.length) return;
  const connected = cy.nodes().filter(n => n.degree() > 0);
  const bb = connected.length ? connected.boundingBox() : { x1: -200, y1: -200, x2: 200, y2: 200 };
  const w = Math.max(bb.x2 - bb.x1, 300);
  const h = Math.max(bb.y2 - bb.y1, 300);
  const cx = (bb.x1 + bb.x2) / 2, cy0 = (bb.y1 + bb.y2) / 2;
  const placed = [];
  isolates.forEach(n => {
    let pos, tries = 0;
    do {
      pos = {
        x: cx + (Math.random() - 0.5) * w * 1.5,
        y: cy0 + (Math.random() - 0.5) * h * 1.5,
      };
      tries++;
    } while (placed.some(p => Math.hypot(p.x - pos.x, p.y - pos.y) < 60) && tries < 30);
    placed.push(pos);
    n.position(pos);
  });
}

// ── Legend ───────────────────────────────────────────────────────────────
function buildLegend() {
  const types = [...new Set(allNodes.map(n => n.type))].sort();
  const body = document.getElementById('legend-body');
  body.innerHTML = types.map(t => `
    <div class="legend-row">
      <span class="legend-dot" style="background:${colorForType(t)}"></span>${t}
    </div>
  `).join('');
}
document.getElementById('legend-toggle').onclick = () => {
  document.getElementById('legend').classList.toggle('open');
};

// ═══════════════════════════════════════════════════════════════════════
// GraphPhysics — mass-spring simulation: gentle idle drift + smooth
// contact collisions.
//
// Every non-grabbed node is a damped spring pulling toward its drift
// target (home + a sine wander). Overlap between two nodes applies a
// contact-only repulsion force (no force at a distance — that was the
// "magnets" complaint). The spring is close to critically damped, so a
// node that gets shoved eases back into place instead of overshooting and
// bouncing — a slow ambient float rather than a jiggle. The node you're
// actually dragging is driven directly by Cytoscape; everything else
// reacts to it each frame.
// ═══════════════════════════════════════════════════════════════════════
class GraphPhysics {
  constructor(cy) {
    this.cy = cy;
    this.nodes = cy.nodes();
    this.raf = null;
    this.t = 0;
    this.last = performance.now();
    this._init();
    this._bindDrag();
  }

  _init() {
    this.nodes.forEach(n => {
      const p = n.position();
      n.scratch('_home', { x: p.x, y: p.y });
      n.scratch('_phase', Math.random() * Math.PI * 2);
      n.scratch('_speed', 0.18 + Math.random() * 0.12);   // gentle drift
      n.scratch('_amp', 3 + Math.random() * 3);             // gentle drift
      n.scratch('_vel', { x: 0, y: 0 });
    });
  }

  _bindDrag() {
    this.cy.on('dragfree', 'node', evt => {
      const n = evt.target;
      const p = n.position();
      n.scratch('_home', { x: p.x, y: p.y });
      n.scratch('_vel', { x: 0, y: 0 });
    });
  }

  start() {
    const tick = (now) => {
      const dt = Math.min((now - this.last) / 1000, 0.032);
      this.last = now;
      this.t += dt;
      if (!document.hidden) this._step(dt);
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  _step(dt) {
    const arr = this.nodes;
    const n = arr.length;
    const K_SPRING = 30;     // pull toward drift target/home (softer)
    const DAMPING = 11;      // ≈ critical for K_SPRING=30 → no overshoot/bounce
    const K_REPEL = 650;     // contact-only collision push (softer)
    const MAX_SPEED = 140;

    const positions = new Array(n);
    for (let i = 0; i < n; i++) positions[i] = arr[i].position();

    const forces = new Array(n);
    for (let i = 0; i < n; i++) forces[i] = { x: 0, y: 0 };

    for (let i = 0; i < n; i++) {
      const node = arr[i];
      if (node.grabbed()) continue;
      const home = node.scratch('_home');
      const phase = node.scratch('_phase');
      const speed = node.scratch('_speed');
      const amp = node.scratch('_amp');
      const tgt = {
        x: home.x + Math.sin(this.t * speed + phase) * amp,
        y: home.y + Math.cos(this.t * speed * 0.85 + phase) * amp,
      };
      forces[i].x += K_SPRING * (tgt.x - positions[i].x);
      forces[i].y += K_SPRING * (tgt.y - positions[i].y);
    }

    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const pi = positions[i], pj = positions[j];
        const ri = arr[i].width() / 2 + 3, rj = arr[j].width() / 2 + 3;
        const minDist = ri + rj + 14;
        let dx = pj.x - pi.x, dy = pj.y - pi.y;
        let dist = Math.hypot(dx, dy);
        if (dist < 0.001) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; dist = 1; }
        if (dist < minDist) {
          const overlap = (minDist - dist) / dist;
          const fx = dx * overlap * K_REPEL, fy = dy * overlap * K_REPEL;
          if (!arr[i].grabbed()) { forces[i].x -= fx; forces[i].y -= fy; }
          if (!arr[j].grabbed()) { forces[j].x += fx; forces[j].y += fy; }
        }
      }
    }

    this.cy.batch(() => {
      for (let i = 0; i < n; i++) {
        const node = arr[i];
        if (node.grabbed() || node.locked()) continue;
        const vel = node.scratch('_vel');
        vel.x += (forces[i].x - DAMPING * vel.x) * dt;
        vel.y += (forces[i].y - DAMPING * vel.y) * dt;
        const sp = Math.hypot(vel.x, vel.y);
        if (sp > MAX_SPEED) { vel.x *= MAX_SPEED / sp; vel.y *= MAX_SPEED / sp; }
        node.position({ x: positions[i].x + vel.x * dt, y: positions[i].y + vel.y * dt });
      }
    });
  }
}

// ── Breathing halo on the focused node ──────────────────────────────────
// A DOM ring synced to the node's rendered (screen) position every frame,
// so it tracks pan/zoom/drift perfectly — not a filled overlay, just a
// slow pulsing outline drawing the eye to whichever single node you
// clicked into.
let haloNode = null;
function initHalo() {
  cy.on('render', updateHaloPosition);
}
function setHaloTarget(node) {
  haloNode = node && node.length ? node : null;
  const el = document.getElementById('node-halo');
  el.classList.toggle('active', !!haloNode);
  if (!haloNode) el.style.opacity = 0;
  updateHaloPosition();
}
function updateHaloPosition() {
  const el = document.getElementById('node-halo');
  if (!haloNode || !haloNode.length || !haloNode.inside()) return;
  const rp = haloNode.renderedPosition();
  const size = Math.max(haloNode.renderedWidth(), haloNode.renderedHeight()) * 1.9;
  el.style.left = rp.x + 'px';
  el.style.top = rp.y + 'px';
  el.style.width = size + 'px';
  el.style.height = size + 'px';
}

// ── Interactions ───────────────────────────────────────────────
function attachInteractions() {
  cy.on('mouseover', 'node', evt => {
    const n = evt.target;
    n.addClass('hover-highlight');
    n.connectedEdges().addClass('edge-label-show');
  });
  cy.on('mouseout', 'node', evt => {
    const n = evt.target;
    n.removeClass('hover-highlight');
    n.connectedEdges().removeClass('edge-label-show');
  });
  cy.on('mouseover', 'edge', evt => evt.target.addClass('edge-label-show'));
  cy.on('mouseout', 'edge', evt => evt.target.removeClass('edge-label-show'));

  cy.on('tap', 'node', evt => openNodeDrawer(evt.target.id()));
  cy.on('tap', 'edge', evt => openEdgeDrawer(evt.target.data()));
  cy.on('tap', evt => { if (evt.target === cy) closeDrawer(); });
}

// ── Drawer: node detail ────────────────────────────────────────────────────
async function openNodeDrawer(id) {
  const drawer = document.getElementById('drawer');
  drawer.classList.add('open');
  document.getElementById('drawer-type').textContent = '…';
  document.getElementById('drawer-title').textContent = id;
  document.getElementById('drawer-summary').textContent = '';
  document.getElementById('drawer-body').innerHTML = '<div class="empty-note" style="padding:14px 20px">Loading…</div>';

  const resp = await fetch(`/node/${encodeURIComponent(id)}`);
  const d = await resp.json();

  document.getElementById('drawer-type').innerHTML = `<span class="dot" style="background:${colorForType(d.type)}"></span>${d.type}`;
  document.getElementById('drawer-title').textContent = d.name;
  document.getElementById('drawer-summary').textContent = d.summary || 'No summary yet.';

  const factRow = (e, otherId, dirLabel) => `
    <div class="fact-row" data-node="${esc(otherId)}">
      <div>${esc(e.fact)}</div>
      <div class="fother"><span class="frel">${esc(e.relation)}</span> · ${dirLabel} <b>${esc(otherId)}</b></div>
    </div>`;

  const outHtml = d.outgoing.length
    ? d.outgoing.map(e => factRow(e, e.target, '→')).join('')
    : '<div class="empty-note">No outgoing facts.</div>';
  const inHtml = d.incoming.length
    ? d.incoming.map(e => factRow(e, e.source, '←')).join('')
    : '<div class="empty-note">No incoming facts.</div>';
  const epHtml = (d.episodes || []).length
    ? d.episodes.map(ep => `
        <div class="fact-row" style="cursor:default">
          <div>${esc(ep.text.slice(0, 160))}${ep.text.length > 160 ? '…' : ''}</div>
          <div class="fother">${esc(ep.source_type || 'source')} ${ep.metadata?.title ? '· ' + esc(ep.metadata.title) : ''}</div>
        </div>`).join('')
    : '<div class="empty-note">No linked source episodes.</div>';

  document.getElementById('drawer-body').innerHTML = `
    <div class="drawer-section"><h4>Outgoing facts</h4>${outHtml}</div>
    <div class="drawer-section"><h4>Incoming facts</h4>${inHtml}</div>
    <div class="drawer-section"><h4>Source episodes</h4>${epHtml}</div>
  `;

  document.querySelectorAll('#drawer-body .fact-row[data-node]').forEach(row => {
    row.onclick = () => openNodeDrawer(row.dataset.node);
  });

  focusEgo(id);
}

function openEdgeDrawer(e) {
  const drawer = document.getElementById('drawer');
  drawer.classList.add('open');
  document.getElementById('drawer-type').textContent = e.relation;
  document.getElementById('drawer-title').textContent = `${e.source} → ${e.target}`;
  document.getElementById('drawer-summary').textContent = e.fact;
  document.getElementById('drawer-body').innerHTML = `
    <div class="drawer-section">
      <h4>Details</h4>
      <div class="fact-row" style="cursor:default">
        <div>score ${e.score} · confidence ${e.confidence}</div>
        <div class="fother">valid from ${e.valid_from ? e.valid_from.slice(0,10) : '?'}${e.valid_until ? ' · until ' + e.valid_until.slice(0,10) : ''}</div>
      </div>
      <div class="fact-row" data-node="${esc(e.source)}">Open <b>${esc(e.source)}</b></div>
      <div class="fact-row" data-node="${esc(e.target)}">Open <b>${esc(e.target)}</b></div>
    </div>
  `;
  document.querySelectorAll('#drawer-body .fact-row[data-node]').forEach(row => {
    row.onclick = () => openNodeDrawer(row.dataset.node);
  });
  clearHighlight();
  const els = cy.$(`#${cySafeId(e.source)}`).union(cy.$(`#${cySafeId(e.target)}`)).union(cy.$(`#${cySafeId(e.id)}`));
  cy.elements().addClass('dimmed');
  els.removeClass('dimmed').addClass('glow');
}

document.getElementById('drawer-close').onclick = closeDrawer;
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  clearHighlight();
}

function focusEgo(id) {
  const node = cy.getElementById(id);
  if (!node.length) return;
  const ego = node.closedNeighborhood();
  clearHighlight();
  cy.elements().addClass('dimmed');
  ego.removeClass('dimmed').addClass('glow');
  setHaloTarget(node);
  cy.animate({ fit: { eles: ego, padding: 80 } }, { duration: 300 });
}

function clearHighlight() {
  cy.elements().removeClass('dimmed').removeClass('glow');
  setHaloTarget(null);
}

// ── Reset ────────────────────────────────────────────────────────────────
document.getElementById('reset-btn').onclick = () => {
  clearHighlight();
  closeDrawer();
  hideAnswer();
  cy.animate({ fit: { eles: cy.elements(), padding: 40 } }, { duration: 300 });
};

// ── Search / autocomplete ──────────────────────────────────────────────────
const qInput = document.getElementById('q');
const acBox = document.getElementById('autocomplete');
let acItems = [];
let acIndex = -1;

qInput.addEventListener('input', () => {
  const val = qInput.value.trim().toLowerCase();
  if (!val) { acBox.classList.remove('show'); return; }
  const matches = allNodes.filter(n =>
    n.name.toLowerCase().includes(val) || n.id.toLowerCase().includes(val)
  ).slice(0, 8);
  acItems = matches;
  acIndex = -1;
  if (!matches.length) { acBox.classList.remove('show'); return; }
  acBox.innerHTML = matches.map((n, i) => `
    <div class="ac-row" data-idx="${i}">
      <span class="ac-name">${esc(n.name)}</span>
      <span class="ac-type">${esc(n.type)}</span>
    </div>`).join('');
  acBox.classList.add('show');
  acBox.querySelectorAll('.ac-row').forEach(row => {
    row.onclick = () => selectEntity(acItems[+row.dataset.idx]);
  });
});

qInput.addEventListener('keydown', e => {
  if (acBox.classList.contains('show') && ['ArrowDown','ArrowUp'].includes(e.key)) {
    e.preventDefault();
    acIndex = e.key === 'ArrowDown'
      ? Math.min(acIndex + 1, acItems.length - 1)
      : Math.max(acIndex - 1, 0);
    acBox.querySelectorAll('.ac-row').forEach((r, i) => r.classList.toggle('active', i === acIndex));
    return;
  }
  if (e.key === 'Enter') {
    if (acIndex >= 0 && acItems[acIndex]) {
      selectEntity(acItems[acIndex]);
    } else {
      runQuery();
    }
  }
  if (e.key === 'Escape') acBox.classList.remove('show');
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-shell')) acBox.classList.remove('show');
});

function selectEntity(n) {
  acBox.classList.remove('show');
  qInput.value = n.name;
  openNodeDrawer(n.id);
}

document.getElementById('ask-btn').onclick = runQuery;

// ── Suggested chips ─────────────────────────────────────────────────────────
function buildChips() {
  const degree = {};
  allEdges.forEach(e => {
    degree[e.source] = (degree[e.source] || 0) + 1;
    degree[e.target] = (degree[e.target] || 0) + 1;
  });
  const top = Object.entries(degree).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => id);
  const nameOf = id => (allNodes.find(n => n.id === id) || {}).name || id;

  const examples = [
    ...top.map(id => `What does ${nameOf(id)} work on?`),
    'Who is connected to the largest number of people?',
  ];
  const chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = examples.map(ex => `<span class="chip">${esc(ex)}</span>`).join('');
  chipsEl.querySelectorAll('.chip').forEach((c, i) => {
    c.onclick = () => { qInput.value = examples[i]; runQuery(); };
  });
}

// ── Query flow ───────────────────────────────────────────────────────────
async function runQuery() {
  const question = qInput.value.trim();
  if (!question) return;
  acBox.classList.remove('show');

  const statusBar = document.getElementById('status-bar');
  const askBtn = document.getElementById('ask-btn');
  askBtn.disabled = true;
  statusBar.className = '';
  statusBar.innerHTML = '<span class="spinner"></span>Querying graph…';

  let data;
  try {
    const resp = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    data = await resp.json();
  } catch (err) {
    statusBar.className = 'error';
    statusBar.textContent = 'Network error: ' + err.message;
    askBtn.disabled = false;
    return;
  }
  askBtn.disabled = false;

  if (data.error) {
    statusBar.className = 'error';
    statusBar.textContent = data.error;
    if (data.debug?.suggestions?.length) {
      qInput.value = '';
      acItems = data.debug.suggestions.map(s => ({ id: s.id, name: s.name, type: s.type }));
      acIndex = -1;
      acBox.innerHTML = acItems.map((n, i) => `
        <div class="ac-row" data-idx="${i}">
          <span class="ac-name">${esc(n.name)}</span><span class="ac-type">${esc(n.type)}</span>
        </div>`).join('');
      acBox.classList.add('show');
      acBox.querySelectorAll('.ac-row').forEach(row => {
        row.onclick = () => selectEntity(acItems[+row.dataset.idx]);
      });
    }
    return;
  }

  const count = data.results.length;
  statusBar.className = '';
  statusBar.textContent = count === 0 ? 'No matching edges found.' : `${count} edge${count !== 1 ? 's' : ''} found`;

  if (count === 0) { hideAnswer(); return; }

  highlightResults(data.results);
  showAnswer(data.answer, data.results);
}

// Chain the (possibly unordered) result edges into a walkable path where
// consecutive edges share an endpoint, so the reveal below can travel hop
// by hop instead of lighting every edge at once. Leftover, unconnected
// edges are appended and still get revealed, just without a "from" hop.
function buildChain(results) {
  if (results.length <= 1) return results.slice();
  const remaining = results.slice();
  const chain = [remaining.shift()];
  let extended = true;
  while (extended && remaining.length) {
    extended = false;
    const last = chain[chain.length - 1];
    const idx = remaining.findIndex(e =>
      e.source === last.target || e.target === last.target ||
      e.source === last.source || e.target === last.source);
    if (idx !== -1) { chain.push(remaining.splice(idx, 1)[0]); extended = true; }
  }
  return chain.concat(remaining);
}

function highlightResults(results) {
  clearHighlight();
  cy.elements().addClass('dimmed');
  const touched = new Set();
  results.forEach(r => touched.add(r.source));
  results.forEach(r => touched.add(r.target));
  const nodeSel = [...touched].map(id => `#${cySafeId(id)}`).join(',');
  const collection = cy.$(nodeSel).union(cy.$(results.map(r => `#${cySafeId(r.id)}`).join(',')));
  if (collection.length) cy.animate({ fit: { eles: collection, padding: 100 } }, { duration: 350 });

  // reveal hop by hop, each edge sending a brief traveling dash-pulse as
  // it lights up, instead of the whole path snapping on simultaneously
  const chain = buildChain(results);
  chain.forEach((r, i) => {
    setTimeout(() => {
      const edgeEl = cy.$(`#${cySafeId(r.id)}`);
      const srcEl = cy.$(`#${cySafeId(r.source)}`);
      const tgtEl = cy.$(`#${cySafeId(r.target)}`);
      srcEl.removeClass('dimmed').addClass('glow');
      tgtEl.removeClass('dimmed').addClass('glow');
      edgeEl.removeClass('dimmed').addClass('glow').addClass('edge-label-show');
      edgeEl.style({ 'line-style': 'dashed', 'line-dash-pattern': [8, 6], 'line-dash-offset': 0 });
      edgeEl.animate(
        { style: { 'line-dash-offset': -28 } },
        { duration: 420, easing: 'ease-out', complete: () => edgeEl.style({ 'line-style': 'solid' }) }
      );
    }, i * 260);
  });
}

function cySafeId(id) {
  return CSS.escape(id);
}

function showAnswer(answer, results) {
  const wrap = document.getElementById('answer-wrap');
  wrap.classList.add('show');
  const factsHtml = results.map(e => `
    <div class="a-fact" data-node="${esc(e.source)}">${esc(e.fact)}</div>
  `).join('');
  wrap.innerHTML = `
    <div class="answer-card">
      <div class="a-label"><span>Answer</span><span class="a-close" id="a-close">✕</span></div>
      <div class="a-text">${answer ? esc(answer) : '<i>No synthesized answer for this query.</i>'}</div>
      <div class="a-facts">${factsHtml}</div>
    </div>
  `;
  document.getElementById('a-close').onclick = hideAnswer;
  wrap.querySelectorAll('.a-fact[data-node]').forEach(row => {
    row.onclick = () => openNodeDrawer(row.dataset.node);
  });
}

function hideAnswer() {
  document.getElementById('answer-wrap').classList.remove('show');
  document.getElementById('answer-wrap').innerHTML = '';
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

loadGraph().then(buildChips);
</script>
