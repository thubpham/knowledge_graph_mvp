<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Graph</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<style>
  :root {
    --bg: #fbfbfa;
    --panel: #ffffff;
    --panel-soft: #f7f7f5;
    --border: #e9e9e7;
    --text: #37352f;
    --text-soft: #787774;
    --text-faint: #9b9a97;
    --accent: #2383e2;
    --accent-soft: #e7f3fe;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
    --shadow-lg: 0 8px 30px rgba(0,0,0,.10);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --panel: #202020;
      --panel-soft: #252525;
      --border: #2f2f2f;
      --text: #e9e9e7;
      --text-soft: #a6a6a3;
      --text-faint: #6f6f6d;
      --accent: #5b9bd9;
      --accent-soft: #1d2b3a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
      --shadow-lg: 0 8px 40px rgba(0,0,0,.5);
    }
  }

  * , *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  #cy { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ── Top search bar ─────────────────────────────────────────── */
  .topbar {
    position: absolute;
    top: 20px; left: 50%; transform: translateX(-50%);
    width: min(640px, calc(100% - 48px));
    z-index: 20;
    display: flex; flex-direction: column; gap: 10px;
  }

  .search-shell {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    padding: 4px 4px 4px 16px;
    gap: 8px;
    position: relative;
  }

  .search-shell input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 0.92rem;
    color: var(--text);
    padding: 10px 0;
  }
  .search-shell input::placeholder { color: var(--text-faint); }

  .search-shell button {
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .12s;
  }
  .search-shell button:hover { opacity: .85; }
  .search-shell button:disabled { opacity: .4; cursor: not-allowed; }

  .autocomplete {
    position: absolute;
    top: calc(100% + 6px); left: 0; right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    max-height: 260px;
    overflow-y: auto;
    display: none;
    z-index: 30;
  }
  .autocomplete.show { display: block; }
  .ac-row { padding: 8px 14px; cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
  .ac-row:hover, .ac-row.active { background: var(--panel-soft); }
  .ac-row .ac-name { font-size: 0.85rem; color: var(--text); }
  .ac-row .ac-type { font-size: 0.7rem; color: var(--text-faint); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 0.76rem;
    color: var(--text-soft);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: border-color .15s, color .15s, transform .1s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

  #status-bar {
    text-align: center;
    font-size: 0.76rem;
    color: var(--text-faint);
    min-height: 16px;
  }
  #status-bar.error { color: #d1453b; }

  /* ── Legend ─────────────────────────────────────────────────── */
  .legend {
    position: absolute;
    bottom: 20px; left: 20px;
    z-index: 20;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    font-size: 0.76rem;
    color: var(--text-soft);
    overflow: hidden;
  }
  .legend-header {
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: .05em;
    font-size: 0.68rem;
  }
  .legend-body { padding: 2px 12px 10px; display: none; flex-direction: column; gap: 6px; }
  .legend.open .legend-body { display: flex; }
  .legend-row { display: flex; align-items: center; gap: 7px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  /* ── Reset / toolbar ────────────────────────────────────────── */
  .toolbar {
    position: absolute;
    bottom: 20px; right: 20px;
    z-index: 20;
    display: flex;
    gap: 8px;
  }
  .tool-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 8px 13px;
    font-size: 0.78rem;
    color: var(--text-soft);
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .tool-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Inspector drawer ───────────────────────────────────────── */
  .drawer {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 360px;
    max-width: 90vw;
    background: var(--panel);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    z-index: 40;
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.4,0,.2,1);
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-head {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .drawer-close {
    position: absolute; top: 16px; right: 16px;
    width: 26px; height: 26px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
  }
  .drawer-close:hover { background: var(--panel-soft); color: var(--text); }

  .drawer-type {
    display: inline-block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-faint);
    background: var(--panel-soft);
    border-radius: 5px;
    padding: 2px 7px;
    margin-bottom: 8px;
  }
  .drawer-title { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; padding-right: 30px; }
  .drawer-summary {
    margin-top: 8px;
    font-size: 0.84rem;
    line-height: 1.55;
    color: var(--text-soft);
  }

  .drawer-body { flex: 1; overflow-y: auto; padding: 4px 0 20px; }
  .drawer-section { padding: 14px 20px 4px; }
  .drawer-section h4 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-faint);
    margin: 0 0 8px;
    font-weight: 600;
  }

  .fact-row {
    padding: 9px 11px;
    background: var(--panel-soft);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 0.82rem;
    line-height: 1.5;
    cursor: pointer;
  }
  .fact-row:hover { outline: 1px solid var(--accent); }
  .fact-row .frel { color: var(--accent); font-family: ui-monospace, monospace; font-size: 0.72rem; }
  .fact-row .fother { color: var(--text-soft); font-size: 0.72rem; margin-top: 3px; }

  .empty-note { font-size: 0.78rem; color: var(--text-faint); padding: 4px 0 10px; }

  /* ── Floating answer card ──────────────────────────────────── */
  .answer-wrap {
    position: absolute;
    left: 20px; bottom: 20px;
    width: min(480px, calc(100% - 400px));
    max-height: 60vh;
    z-index: 25;
    display: none;
    flex-direction: column;
  }
  .answer-wrap.show { display: flex; }

  .answer-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 16px 18px;
    overflow-y: auto;
  }
  .answer-card .a-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--accent);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .answer-card .a-close { cursor: pointer; color: var(--text-faint); font-size: 0.9rem; }
  .answer-card .a-text { font-size: 0.88rem; line-height: 1.6; color: var(--text); }

  .answer-card .a-facts { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .answer-card .a-fact {
    font-size: 0.78rem;
    color: var(--text-soft);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .answer-card .a-fact:last-child { border-bottom: none; }
  .answer-card .a-fact:hover { color: var(--accent); }

  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 50;
    font-size: 0.85rem;
    color: var(--text-faint);
  }
  .loading-overlay.hide { display: none; }
</style>
</head>
<body>

<div id="cy"></div>

<div class="loading-overlay" id="loading">
  <span class="spinner"></span>&nbsp;Loading graph…
</div>

<div class="topbar">
  <div class="search-shell">
    <input id="q" type="text" placeholder="Ask a question, or search an entity…" autocomplete="off" />
    <button id="ask-btn">Ask</button>
    <div class="autocomplete" id="autocomplete"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="status-bar"></div>
</div>

<div class="legend" id="legend">
  <div class="legend-header" id="legend-toggle">● Legend</div>
  <div class="legend-body" id="legend-body"></div>
</div>

<div class="toolbar">
  <div class="tool-btn" id="reset-btn">Reset view</div>
</div>

<div class="answer-wrap" id="answer-wrap"></div>

<div class="drawer" id="drawer">
  <div class="drawer-head">
    <button class="drawer-close" id="drawer-close">✕</button>
    <div class="drawer-type" id="drawer-type"></div>
    <div class="drawer-title" id="drawer-title"></div>
    <div class="drawer-summary" id="drawer-summary"></div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
cytoscape.use(cytoscapeFcose);

// ── Type color palette (Notion-muted) ───────────────────────────────────────
const TYPE_COLORS = {
  person:       '#4f8ef7',
  service:      '#2eaa6c',
  tool:         '#e8a33d',
  concept:      '#9b7fd4',
  team:         '#e0679a',
  organization: '#4bb8c4',
  event:        '#e0603f',
  location:     '#8a8a86',
  website:      '#5b9bd9',
};
const FALLBACK_COLORS = ['#7c9cbf','#c98a5e','#7fae7f','#b08cc9','#c9a15e'];
let colorIdx = 0;
function colorForType(t) {
  if (!TYPE_COLORS[t]) {
    TYPE_COLORS[t] = FALLBACK_COLORS[colorIdx % FALLBACK_COLORS.length];
    colorIdx++;
  }
  return TYPE_COLORS[t];
}

let cy;
let allNodes = [];
let allEdges = [];
let idleAnim = { running: false, raf: null };

// ── Load graph ───────────────────────────────────────────────────────────
async function loadGraph() {
  const resp = await fetch('/graph');
  const data = await resp.json();
  allNodes = data.nodes;
  allEdges = data.edges;

  const elements = [
    ...allNodes.map(n => ({
      data: { id: n.id, label: n.name, type: n.type, summary: n.summary },
    })),
    ...allEdges.map(e => ({
      data: {
        id: e.id, source: e.source, target: e.target,
        relation: e.relation, fact: e.fact, score: e.score,
        valid_from: e.valid_from, valid_until: e.valid_until, confidence: e.confidence,
      },
    })),
  ];

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    minZoom: 0.1,
    maxZoom: 3.5,
    wheelSensitivity: 0.25,
    style: [
      { selector: 'node', style: {
        'background-color': ele => colorForType(ele.data('type')),
        'label': 'data(label)',
        'font-size': 8,
        'color': 'var(--text-soft)'.startsWith('var') ? '#787774' : '',
        'text-valign': 'bottom',
        'text-margin-y': 4,
        'width': 16, 'height': 16,
        'border-width': 2,
        'border-color': '#ffffff',
        'border-opacity': 0.7,
        'transition-property': 'opacity, background-color, width, height, border-width',
        'transition-duration': 120,
      }},
      { selector: 'node[type="person"]', style: { 'width': 20, 'height': 20 } },
      { selector: 'edge', style: {
        'width': 1,
        'curve-style': 'bezier',
        'line-color': '#c9c9c4',
        'target-arrow-color': '#c9c9c4',
        'target-arrow-shape': 'triangle',
        'arrow-scale': 0.6,
        'opacity': 0.35,
        'label': '',
        'font-size': 7,
        'color': '#9b9a97',
        'text-rotation': 'autorotate',
        'transition-property': 'opacity, line-color, width',
        'transition-duration': 120,
      }},
      { selector: 'node:selected', style: {
        'border-color': '#2383e2', 'border-width': 3, 'border-opacity': 1,
      }},
      { selector: '.hover-highlight', style: {
        'width': 24, 'height': 24, 'border-width': 3, 'border-color': '#2383e2',
      }},
      { selector: '.edge-label-show', style: { 'label': 'data(relation)' } },
      { selector: '.dimmed', style: { 'opacity': 0.08 } },
      { selector: '.glow', style: {
        'opacity': 1,
        'line-color': '#2383e2', 'target-arrow-color': '#2383e2', 'width': 2.2,
      }},
      { selector: 'node.glow', style: {
        'border-color': '#2383e2', 'border-width': 3,
      }},
    ],
    layout: { name: 'fcose', animate: false, randomize: true, nodeSeparation: 90, idealEdgeLength: 70 },
  });

  document.getElementById('loading').classList.add('hide');
  buildLegend();
  attachInteractions();
  startIdleMotion();
}

// ── Legend ───────────────────────────────────────────────────────────────
function buildLegend() {
  const types = [...new Set(allNodes.map(n => n.type))].sort();
  const body = document.getElementById('legend-body');
  body.innerHTML = types.map(t => `
    <div class="legend-row">
      <span class="legend-dot" style="background:${colorForType(t)}"></span>${t}
    </div>
  `).join('');
}
document.getElementById('legend-toggle').onclick = () => {
  document.getElementById('legend').classList.toggle('open');
};

// ── Idle "alive" drift ─────────────────────────────────────────────────────
function startIdleMotion() {
  const nodes = cy.nodes();
  nodes.forEach(n => {
    const p = n.position();
    n.data('_home', { x: p.x, y: p.y });
    n.data('_phase', Math.random() * Math.PI * 2);
    n.data('_speed', 0.4 + Math.random() * 0.4);
    n.data('_amp', 1.5 + Math.random() * 2);
  });

  let t = 0;
  let last = performance.now();
  function tick(now) {
    const dt = (now - last) / 1000;
    last = now;
    t += dt;
    if (!cy.$(':grabbed').length && !document.hidden) {
      cy.batch(() => {
        nodes.forEach(n => {
          if (n.grabbed() || n.locked()) return;
          const home = n.data('_home');
          const phase = n.data('_phase');
          const speed = n.data('_speed');
          const amp = n.data('_amp');
          n.position({
            x: home.x + Math.sin(t * speed + phase) * amp,
            y: home.y + Math.cos(t * speed * 0.8 + phase) * amp,
          });
        });
      });
    }
    idleAnim.raf = requestAnimationFrame(tick);
  }
  idleAnim.raf = requestAnimationFrame(tick);

  // re-anchor home position after manual drag
  cy.on('dragfree', 'node', evt => {
    const n = evt.target;
    const p = n.position();
    n.data('_home', { x: p.x, y: p.y });
  });
}

// ── Interactions ─────────────────────────────────────────────────────────
function attachInteractions() {
  cy.on('mouseover', 'node', evt => {
    const n = evt.target;
    n.addClass('hover-highlight');
    n.connectedEdges().addClass('edge-label-show');
  });
  cy.on('mouseout', 'node', evt => {
    const n = evt.target;
    n.removeClass('hover-highlight');
    n.connectedEdges().removeClass('edge-label-show');
  });
  cy.on('mouseover', 'edge', evt => evt.target.addClass('edge-label-show'));
  cy.on('mouseout', 'edge', evt => evt.target.removeClass('edge-label-show'));

  cy.on('tap', 'node', evt => openNodeDrawer(evt.target.id()));
  cy.on('tap', 'edge', evt => openEdgeDrawer(evt.target.data()));
  cy.on('tap', evt => { if (evt.target === cy) closeDrawer(); });
}

// ── Drawer: node detail ────────────────────────────────────────────────────
async function openNodeDrawer(id) {
  const drawer = document.getElementById('drawer');
  drawer.classList.add('open');
  document.getElementById('drawer-type').textContent = '…';
  document.getElementById('drawer-title').textContent = id;
  document.getElementById('drawer-summary').textContent = '';
  document.getElementById('drawer-body').innerHTML = '<div class="empty-note" style="padding:14px 20px">Loading…</div>';

  const resp = await fetch(`/node/${encodeURIComponent(id)}`);
  const d = await resp.json();

  document.getElementById('drawer-type').textContent = d.type;
  document.getElementById('drawer-title').textContent = d.name;
  document.getElementById('drawer-summary').textContent = d.summary || 'No summary yet.';

  const factRow = (e, otherId, dirLabel) => `
    <div class="fact-row" data-node="${esc(otherId)}">
      <div>${esc(e.fact)}</div>
      <div class="fother"><span class="frel">${esc(e.relation)}</span> · ${dirLabel} <b>${esc(otherId)}</b></div>
    </div>`;

  const outHtml = d.outgoing.length
    ? d.outgoing.map(e => factRow(e, e.target, '→')).join('')
    : '<div class="empty-note">No outgoing facts.</div>';
  const inHtml = d.incoming.length
    ? d.incoming.map(e => factRow(e, e.source, '←')).join('')
    : '<div class="empty-note">No incoming facts.</div>';
  const epHtml = d.episodes.length
    ? d.episodes.map(ep => `
        <div class="fact-row" style="cursor:default">
          <div>${esc(ep.text.slice(0, 160))}${ep.text.length > 160 ? '…' : ''}</div>
          <div class="fother">${esc(ep.source_type || 'source')} ${ep.metadata?.title ? '· ' + esc(ep.metadata.title) : ''}</div>
        </div>`).join('')
    : '<div class="empty-note">No linked source episodes.</div>';

  document.getElementById('drawer-body').innerHTML = `
    <div class="drawer-section"><h4>Outgoing facts</h4>${outHtml}</div>
    <div class="drawer-section"><h4>Incoming facts</h4>${inHtml}</div>
    <div class="drawer-section"><h4>Source episodes</h4>${epHtml}</div>
  `;

  document.querySelectorAll('#drawer-body .fact-row[data-node]').forEach(row => {
    row.onclick = () => openNodeDrawer(row.dataset.node);
  });

  focusEgo(id);
}

function openEdgeDrawer(e) {
  const drawer = document.getElementById('drawer');
  drawer.classList.add('open');
  document.getElementById('drawer-type').textContent = e.relation;
  document.getElementById('drawer-title').textContent = `${e.source} → ${e.target}`;
  document.getElementById('drawer-summary').textContent = e.fact;
  document.getElementById('drawer-body').innerHTML = `
    <div class="drawer-section">
      <h4>Details</h4>
      <div class="fact-row" style="cursor:default">
        <div>score ${e.score} · confidence ${e.confidence}</div>
        <div class="fother">valid from ${e.valid_from ? e.valid_from.slice(0,10) : '?'}${e.valid_until ? ' · until ' + e.valid_until.slice(0,10) : ''}</div>
      </div>
      <div class="fact-row" data-node="${esc(e.source)}">Open <b>${esc(e.source)}</b></div>
      <div class="fact-row" data-node="${esc(e.target)}">Open <b>${esc(e.target)}</b></div>
    </div>
  `;
  document.querySelectorAll('#drawer-body .fact-row[data-node]').forEach(row => {
    row.onclick = () => openNodeDrawer(row.dataset.node);
  });
}

document.getElementById('drawer-close').onclick = closeDrawer;
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  clearHighlight();
}

function focusEgo(id) {
  const node = cy.getElementById(id);
  if (!node.length) return;
  const ego = node.closedNeighborhood();
  clearHighlight();
  cy.elements().addClass('dimmed');
  ego.removeClass('dimmed').addClass('glow');
  cy.animate({ fit: { eles: ego, padding: 80 } }, { duration: 300 });
}

function clearHighlight() {
  cy.elements().removeClass('dimmed').removeClass('glow');
}

// ── Reset ────────────────────────────────────────────────────────────────
document.getElementById('reset-btn').onclick = () => {
  clearHighlight();
  closeDrawer();
  hideAnswer();
  cy.animate({ fit: { eles: cy.elements(), padding: 40 } }, { duration: 300 });
};

// ── Search / autocomplete ──────────────────────────────────────────────────
const qInput = document.getElementById('q');
const acBox = document.getElementById('autocomplete');
let acItems = [];
let acIndex = -1;

qInput.addEventListener('input', () => {
  const val = qInput.value.trim().toLowerCase();
  if (!val) { acBox.classList.remove('show'); return; }
  const matches = allNodes.filter(n =>
    n.name.toLowerCase().includes(val) || n.id.toLowerCase().includes(val)
  ).slice(0, 8);
  acItems = matches;
  acIndex = -1;
  if (!matches.length) { acBox.classList.remove('show'); return; }
  acBox.innerHTML = matches.map((n, i) => `
    <div class="ac-row" data-idx="${i}">
      <span class="ac-name">${esc(n.name)}</span>
      <span class="ac-type">${esc(n.type)}</span>
    </div>`).join('');
  acBox.classList.add('show');
  acBox.querySelectorAll('.ac-row').forEach(row => {
    row.onclick = () => selectEntity(acItems[+row.dataset.idx]);
  });
});

qInput.addEventListener('keydown', e => {
  if (acBox.classList.contains('show') && ['ArrowDown','ArrowUp'].includes(e.key)) {
    e.preventDefault();
    acIndex = e.key === 'ArrowDown'
      ? Math.min(acIndex + 1, acItems.length - 1)
      : Math.max(acIndex - 1, 0);
    acBox.querySelectorAll('.ac-row').forEach((r, i) => r.classList.toggle('active', i === acIndex));
    return;
  }
  if (e.key === 'Enter') {
    if (acIndex >= 0 && acItems[acIndex]) {
      selectEntity(acItems[acIndex]);
    } else {
      runQuery();
    }
  }
  if (e.key === 'Escape') acBox.classList.remove('show');
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-shell')) acBox.classList.remove('show');
});

function selectEntity(n) {
  acBox.classList.remove('show');
  qInput.value = n.name;
  openNodeDrawer(n.id);
}

document.getElementById('ask-btn').onclick = runQuery;

// ── Suggested chips ─────────────────────────────────────────────────────────
function buildChips() {
  const degree = {};
  allEdges.forEach(e => {
    degree[e.source] = (degree[e.source] || 0) + 1;
    degree[e.target] = (degree[e.target] || 0) + 1;
  });
  const top = Object.entries(degree).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => id);
  const nameOf = id => (allNodes.find(n => n.id === id) || {}).name || id;

  const examples = [
    ...top.map(id => `What does ${nameOf(id)} work on?`),
    'Who is connected to the largest number of people?',
  ];
  const chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = examples.map(ex => `<span class="chip">${esc(ex)}</span>`).join('');
  chipsEl.querySelectorAll('.chip').forEach((c, i) => {
    c.onclick = () => { qInput.value = examples[i]; runQuery(); };
  });
}

// ── Query flow ───────────────────────────────────────────────────────────
async function runQuery() {
  const question = qInput.value.trim();
  if (!question) return;
  acBox.classList.remove('show');

  const statusBar = document.getElementById('status-bar');
  const askBtn = document.getElementById('ask-btn');
  askBtn.disabled = true;
  statusBar.className = '';
  statusBar.innerHTML = '<span class="spinner"></span>Querying graph…';

  let data;
  try {
    const resp = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    data = await resp.json();
  } catch (err) {
    statusBar.className = 'error';
    statusBar.textContent = 'Network error: ' + err.message;
    askBtn.disabled = false;
    return;
  }
  askBtn.disabled = false;

  if (data.error) {
    statusBar.className = 'error';
    statusBar.textContent = data.error;
    if (data.debug?.suggestions?.length) {
      qInput.value = '';
      acItems = data.debug.suggestions.map(s => ({ id: s.id, name: s.name, type: s.type }));
      acIndex = -1;
      acBox.innerHTML = acItems.map((n, i) => `
        <div class="ac-row" data-idx="${i}">
          <span class="ac-name">${esc(n.name)}</span><span class="ac-type">${esc(n.type)}</span>
        </div>`).join('');
      acBox.classList.add('show');
      acBox.querySelectorAll('.ac-row').forEach(row => {
        row.onclick = () => selectEntity(acItems[+row.dataset.idx]);
      });
    }
    return;
  }

  const count = data.results.length;
  statusBar.className = '';
  statusBar.textContent = count === 0 ? 'No matching edges found.' : `${count} edge${count !== 1 ? 's' : ''} found`;

  if (count === 0) { hideAnswer(); return; }

  highlightResults(data.results);
  showAnswer(data.answer, data.results);
}

function highlightResults(results) {
  clearHighlight();
  cy.elements().addClass('dimmed');
  const touched = new Set();
  results.forEach(r => touched.add(r.source));
  results.forEach(r => touched.add(r.target));
  const nodeSel = [...touched].map(id => `#${cySafeId(id)}`).join(',');
  const nodes = cy.$(nodeSel);
  const edges = cy.$(results.map(r => `#${cySafeId(r.id)}`).join(','));
  nodes.removeClass('dimmed').addClass('glow');
  edges.removeClass('dimmed').addClass('glow').addClass('edge-label-show');
  const collection = nodes.union(edges);
  if (collection.length) cy.animate({ fit: { eles: collection, padding: 100 } }, { duration: 350 });
}

function cySafeId(id) {
  return CSS.escape(id);
}

function showAnswer(answer, results) {
  const wrap = document.getElementById('answer-wrap');
  wrap.classList.add('show');
  const factsHtml = results.map(e => `
    <div class="a-fact" data-node="${esc(e.source)}">${esc(e.fact)}</div>
  `).join('');
  wrap.innerHTML = `
    <div class="answer-card">
      <div class="a-label"><span>Answer</span><span class="a-close" id="a-close">✕</span></div>
      <div class="a-text">${answer ? esc(answer) : '<i>No synthesized answer for this query.</i>'}</div>
      <div class="a-facts">${factsHtml}</div>
    </div>
  `;
  document.getElementById('a-close').onclick = hideAnswer;
  wrap.querySelectorAll('.a-fact[data-node]').forEach(row => {
    row.onclick = () => openNodeDrawer(row.dataset.node);
  });
}

function hideAnswer() {
  document.getElementById('answer-wrap').classList.remove('show');
  document.getElementById('answer-wrap').innerHTML = '';
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

loadGraph().then(buildChips);
</script>
